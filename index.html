<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bức tường Ghi chú Tương tác</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* --- CSS BIẾN & CƠ BẢN --- */
    :root {
      --bg-color: #f4f7f6;
      --wall-bg: #e2e8f0;
      --text-color: #333;
      --header-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --bg-color: #1a202c;
      --wall-bg: #2d3748;
      --text-color: #f7fafc;
      --header-bg: #1a202c;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    /* Cập nhật body: Chặn native pull-to-refresh trên mobile và lấy màu nền của wall */
    body { 
        background-color: var(--wall-bg); 
        color: var(--text-color); 
        overflow: hidden; 
        transition: background-color 0.3s; 
        touch-action: none; 
        user-select: none;
    }

    /* --- HEADER --- */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: var(--header-bg); box-shadow: var(--shadow);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 1000; transition: background 0.3s;
    }

    .logo { font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    
    .search-bar {
      flex-grow: 1; max-width: 350px; margin: 0 20px; position: relative;
    }
    
    .search-bar input {
      width: 100%; padding: 10px 15px 10px 40px; border-radius: 20px;
      border: 1px solid #ccc; outline: none; background: transparent; color: var(--text-color);
    }
    
    .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }

    .actions { display: flex; gap: 10px; }
    button { cursor: pointer; border: none; outline: none; transition: 0.2s; }
    
    .btn-icon {
      width: 40px; height: 40px; border-radius: 50%; background: #edf2f7;
      color: #333; display: flex; justify-content: center; align-items: center; font-size: 1.1rem;
    }
    body.dark-mode .btn-icon { background: #4a5568; color: #fff; }
    .btn-icon:hover { transform: scale(1.1); }
    
    .btn-add {
      background: #4299e1; color: white; padding: 0 20px; border-radius: 20px;
      font-weight: bold; display: flex; align-items: center; gap: 8px;
    }
    .btn-add:hover { background: #3182ce; }

    /* --- WALL & STICKY NOTES --- */
    #wall {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      transform-origin: 0 0; /* Rất quan trọng để tính toán tọa độ Zoom */
      will-change: transform;
    }

    .note {
      position: absolute; width: 250px; min-height: 220px; padding: 15px;
      border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column;
      cursor: grab; user-select: none; transition: box-shadow 0.2s, transform 0.1s;
    }
    .note:active { cursor: grabbing; z-index: 99 !important; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    
    .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; color: #333;}
    .note-content { flex-grow: 1; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; color: #222;}
    .note-footer { margin-top: 10px; text-align: right; font-size: 0.8rem; font-style: italic; color: rgba(0,0,0,0.6); }
    .btn-delete { background: transparent; color: rgba(0,0,0,0.5); font-size: 1.1rem; }
    .btn-delete:hover { color: red; }

    /* --- MODAL ADD NOTE --- */
    #modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 2000;
      display: none; justify-content: center; align-items: center;
    }
    .modal {
      background: var(--header-bg); width: 90%; max-width: 400px;
      padding: 25px; border-radius: 12px; box-shadow: var(--shadow);
    }
    .modal h2 { margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input[type="text"], .form-group textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
      background: transparent; color: var(--text-color); resize: none;
    }
    .color-picker { display: flex; gap: 10px; margin-top: 5px; }
    .color-option {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: 0.2s;
    }
    .color-option.selected { border-color: #333; transform: scale(1.1); }
    body.dark-mode .color-option.selected { border-color: #fff; }
    
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancel { padding: 10px 15px; border-radius: 6px; background: #e2e8f0; color: #333; }
    .btn-save { padding: 10px 20px; border-radius: 6px; background: #48bb78; color: white; font-weight: bold; }
    .btn-save:hover { background: #38a169; }
    
    .hidden { display: none !important; }

    /* Responsive */
    @media (max-width: 768px) {
      .logo span { display: none; }
      .btn-add span { display: none; }
      .search-bar { max-width: 180px; }
      #zoomOutBtn, #zoomResetBtn, #zoomInBtn { display: none; /* Ẩn nút zoom trên mobile vì đã có Pinch to Zoom */ }
    }
  </style>
</head>
<body>

  <header id="app-header">
    <div class="logo"><i class="fas fa-sticky-note" style="color:#ecc94b;"></i> <span>Note Wall</span></div>
    
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Tìm theo tên hoặc nội dung...">
    </div>

    <div class="actions">
      <!-- Các nút điều khiển Zoom -->
      <button class="btn-icon" id="zoomOutBtn" title="Thu nhỏ"><i class="fas fa-search-minus"></i></button>
      <button class="btn-icon" id="zoomResetBtn" title="Đặt lại Mặc định"><i class="fas fa-compress"></i></button>
      <button class="btn-icon" id="zoomInBtn" title="Phóng to"><i class="fas fa-search-plus"></i></button>

      <button class="btn-icon" id="themeToggle" title="Đổi giao diện"><i class="fas fa-moon"></i></button>
      <button class="btn-add" id="openModalBtn"><i class="fas fa-plus"></i> <span>Tạo Ghi Chú</span></button>
    </div>
  </header>

  <!-- Container của Bức Tường -->
  <div id="wall"></div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">
      <h2>Tạo ghi chú mới</h2>
      <div class="form-group">
        <label>Tên của bạn *</label>
        <input type="text" id="authorInput" placeholder="VD: Tuấn Nguyễn" required>
      </div>
      <div class="form-group">
        <label>Nội dung *</label>
        <textarea id="contentInput" rows="4" placeholder="Nhập nội dung ghi chú..." required></textarea>
      </div>
      <div class="form-group">
        <label>Màu sắc</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-option selected" data-color="#fef3c7" style="background-color: #fef3c7;"></div>
          <div class="color-option" data-color="#fce7f3" style="background-color: #fce7f3;"></div>
          <div class="color-option" data-color="#e0e7ff" style="background-color: #e0e7ff;"></div>
          <div class="color-option" data-color="#d1fae5" style="background-color: #d1fae5;"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeModalBtn">Hủy</button>
        <button class="btn-save" id="saveNoteBtn">Dán lên tường</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZiGa7KakG43YbCuYw1VYBwNdGgivVZtU",
      authDomain: "buctuongghichu.firebaseapp.com",
      projectId: "buctuongghichu",
      storageBucket: "buctuongghichu.firebasestorage.app",
      messagingSenderId: "542301209901",
      appId: "1:542301209901:web:f142e4a549e50ede0d7fa4",
      measurementId: "G-V7NQZK0T1H"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const notesCollection = collection(db, "notes");

    /* ==============================
       LOGIC PAN & ZOOM (TÍNH NĂNG MỚI)
    ============================== */
    const wall = document.getElementById('wall');
    let scale = 1;
    let panX = 0;
    let panY = 0;

    function applyTransform() {
      wall.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    // Giao diện Nút bấm Zoom
    document.getElementById('zoomInBtn').addEventListener('click', () => { setZoom(scale * 1.2, window.innerWidth/2, window.innerHeight/2); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { setZoom(scale / 1.2, window.innerWidth/2, window.innerHeight/2); });
    document.getElementById('zoomResetBtn').addEventListener('click', () => { scale = 1; panX = 0; panY = 0; applyTransform(); });

    function setZoom(newScale, centerX, centerY) {
      const minScale = 0.3;
      const maxScale = 3;
      const clampedScale = Math.min(Math.max(minScale, newScale), maxScale);
      
      // Tính toán để điểm Zoom hướng về vị trí con trỏ / trung tâm màn hình
      const xs = (centerX - panX) / scale;
      const ys = (centerY - panY) / scale;
      
      scale = clampedScale;
      panX = centerX - xs * scale;
      panY = centerY - ys * scale;
      applyTransform();
    }

    // 1. Zoom bằng con lăn chuột (Desktop)
    window.addEventListener('wheel', (e) => {
      // Bỏ qua nếu đang cuộn trong modal hoặc tìm kiếm
      if (e.target.closest('#modal-overlay') || e.target.closest('#app-header')) return;
      e.preventDefault();
      
      if (e.deltaY < 0) {
        setZoom(scale * 1.1, e.clientX, e.clientY); // Phóng to
      } else {
        setZoom(scale / 1.1, e.clientX, e.clientY); // Thu nhỏ
      }
    }, { passive: false });

    // 2. Pan (Kéo thả vùng trống) & Pinch to Zoom (Điện thoại)
    let isPanningSpace = false;
    let startPanX, startPanY;
    let initialPinchDist = null;
    let initialScale = 1;

    document.body.addEventListener('mousedown', (e) => {
      // Nếu click vào ghi chú, modal hoặc header thì bỏ qua để nhường cho hàm khác
      if (e.target.closest('.note') || e.target.closest('#modal-overlay') || e.target.closest('#app-header')) return;
      isPanningSpace = true;
      startPanX = e.clientX - panX;
      startPanY = e.clientY - panY;
      document.body.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanningSpace) return;
      panX = e.clientX - startPanX;
      panY = e.clientY - startPanY;
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanningSpace = false;
      document.body.style.cursor = 'default';
    });

    // Touch Event (Mobile)
    document.body.addEventListener('touchstart', (e) => {
      if (e.target.closest('#modal-overlay') || e.target.closest('#app-header')) return;
      
      if (e.touches.length === 1 && !e.target.closest('.note')) {
        // Kéo bằng 1 ngón tay trên nền trống
        isPanningSpace = true;
        startPanX = e.touches[0].clientX - panX;
        startPanY = e.touches[0].clientY - panY;
      } 
      else if (e.touches.length === 2) {
        // Thu phóng bằng 2 ngón tay
        isPanningSpace = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
        
        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        startPanX = (centerX - panX) / scale;
        startPanY = (centerY - panY) / scale;
      }
    }, { passive: false });

    document.body.addEventListener('touchmove', (e) => {
      if (e.target.closest('#modal-overlay') || e.target.closest('#app-header')) return;
      
      if (isPanningSpace && e.touches.length === 1) {
        e.preventDefault();
        panX = e.touches[0].clientX - startPanX;
        panY = e.touches[0].clientY - startPanY;
        applyTransform();
      } 
      else if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        
        scale = initialScale * (currentDist / initialPinchDist);
        scale = Math.min(Math.max(0.3, scale), 3);
        
        const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        
        panX = centerX - startPanX * scale;
        panY = centerY - startPanY * scale;
        applyTransform();
      }
    }, { passive: false });

    document.body.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
      if (e.touches.length === 0) isPanningSpace = false;
    });

    /* ==============================
       LOGIC GIAO DIỆN & SỰ KIỆN CŨ
    ============================== */
    const searchInput = document.getElementById('searchInput');
    const modalOverlay = document.getElementById('modal-overlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const themeToggle = document.getElementById('themeToggle');
    
    // Xử lý Dark / Light Mode
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Xử lý Chọn Màu
    let selectedColor = '#fef3c7';
    document.querySelectorAll('.color-option').forEach(option => {
      option.addEventListener('click', (e) => {
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedColor = e.target.getAttribute('data-color');
      });
    });

    // Mở / Đóng Modal
    openModalBtn.addEventListener('click', () => modalOverlay.style.display = 'flex');
    closeModalBtn.addEventListener('click', () => modalOverlay.style.display = 'none');

    // Thêm Ghi Chú mới
    saveNoteBtn.addEventListener('click', async () => {
      const author = document.getElementById('authorInput').value.trim();
      const content = document.getElementById('contentInput').value.trim();

      if (!author || !content) {
        alert("Vui lòng nhập đầy đủ tên và nội dung!");
        return;
      }

      const randomOffset = Math.floor(Math.random() * 50) - 25;
      
      // Tính toán tạo Ghi chú luôn xuất hiện ở ngay chính giữa màn hình hiện tại (kể cả khi đã Zoom hoặc Pan)
      const x = (window.innerWidth / 2 - panX) / scale - 125 + randomOffset; 
      const y = (window.innerHeight / 2 - panY) / scale - 110 + randomOffset;

      const newNote = {
        author,
        content,
        color: selectedColor,
        x: x,
        y: y,
        createdAt: new Date().toISOString()
      };

      try {
        saveNoteBtn.disabled = true;
        saveNoteBtn.innerText = "Đang lưu...";
        await addDoc(notesCollection, newNote);
        
        document.getElementById('authorInput').value = '';
        document.getElementById('contentInput').value = '';
        modalOverlay.style.display = 'none';
      } catch (error) {
        console.error("Lỗi khi thêm ghi chú: ", error);
        alert("Lỗi mạng! Không thể lưu ghi chú.");
      } finally {
        saveNoteBtn.disabled = false;
        saveNoteBtn.innerText = "Dán lên tường";
      }
    });

    // Tìm kiếm ghi chú
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.note').forEach(note => {
        const author = note.querySelector('.note-author').innerText.toLowerCase();
        const content = note.querySelector('.note-content').innerText.toLowerCase();
        if (author.includes(query) || content.includes(query)) {
          note.classList.remove('hidden');
        } else {
          note.classList.add('hidden');
        }
      });
    });

    /* ==============================
       LOGIC REALTIME FIREBASE & KÉO THẢ CẬP NHẬT THEO SCALE
    ============================== */
    onSnapshot(notesCollection, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          renderNoteToWall(change.doc.id, change.doc.data());
        }
        if (change.type === "modified") {
          updateNoteInDOM(change.doc.id, change.doc.data());
        }
        if (change.type === "removed") {
          const noteEl = document.getElementById(change.doc.id);
          if (noteEl) noteEl.remove();
        }
      });
    });

    function renderNoteToWall(id, data) {
      const note = document.createElement('div');
      note.className = 'note';
      note.id = id;
      note.style.backgroundColor = data.color;
      note.style.left = `${data.x}px`;
      note.style.top = `${data.y}px`;

      note.innerHTML = `
        <div class="note-header">
          <span class="note-author"><i class="fas fa-user-circle"></i> ${escapeHTML(data.author)}</span>
          <button class="btn-delete" title="Xóa ghi chú"><i class="fas fa-times"></i></button>
        </div>
        <div class="note-content">${escapeHTML(data.content)}</div>
      `;

      note.querySelector('.btn-delete').addEventListener('click', async (e) => {
        e.stopPropagation();
        if(confirm("Bạn có chắc chắn muốn gỡ ghi chú này xuống không?")) {
          await deleteDoc(doc(db, "notes", id));
        }
      });

      makeDraggable(note, id);
      wall.appendChild(note);

      const query = searchInput.value.toLowerCase();
      if(query && !(data.author.toLowerCase().includes(query) || data.content.toLowerCase().includes(query))) {
        note.classList.add('hidden');
      }
    }

    function updateNoteInDOM(id, data) {
      const note = document.getElementById(id);
      if (note) {
        note.style.left = `${data.x}px`;
        note.style.top = `${data.y}px`;
        note.style.backgroundColor = data.color;
        note.querySelector('.note-author').innerHTML = `<i class="fas fa-user-circle"></i> ${escapeHTML(data.author)}`;
        note.querySelector('.note-content').innerText = data.content;
      }
    }

    let maxZIndex = 1;
    function makeDraggable(element, id) {
      let isDragging = false;
      let startX, startY, initialX, initialY;

      const dragStart = (e) => {
        if (e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'i') return;
        
        isDragging = true;
        maxZIndex++;
        element.style.zIndex = maxZIndex;

        if (e.type === 'touchstart') {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        } else {
          startX = e.clientX;
          startY = e.clientY;
        }

        initialX = parseFloat(element.style.left || 0);
        initialY = parseFloat(element.style.top || 0);

        document.addEventListener('mousemove', dragAction);
        document.addEventListener('touchmove', dragAction, { passive: false });
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);
      };

      const dragAction = (e) => {
        if (!isDragging) return;
        e.preventDefault(); 

        let currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        let currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        // Cập nhật quan trọng: Chia độ dời cho tỷ lệ Zoom (scale)
        let dx = (currentX - startX) / scale;
        let dy = (currentY - startY) / scale;

        let newLeft = initialX + dx;
        let newTop = initialY + dy;

        element.style.left = `${newLeft}px`;
        element.style.top = `${newTop}px`;
      };

      const dragEnd = async (e) => {
        if (!isDragging) return;
        isDragging = false;

        document.removeEventListener('mousemove', dragAction);
        document.removeEventListener('touchmove', dragAction);
        document.removeEventListener('mouseup', dragEnd);
        document.removeEventListener('touchend', dragEnd);

        try {
          const noteRef = doc(db, "notes", id);
          await updateDoc(noteRef, {
            x: parseFloat(element.style.left),
            y: parseFloat(element.style.top)
          });
        } catch (error) {
          console.error("Lỗi cập nhật vị trí: ", error);
        }
      };

      element.addEventListener('mousedown', dragStart);
      element.addEventListener('touchstart', dragStart, { passive: false });
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
